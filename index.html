<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Bar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
   <main>
    <div class="container">
        <button class="gift-btn" id="giftBtn">
            <i class="fa-solid fa-gift"></i>
        </button>
    </div>

    <!-- Popup Sidebar -->
    <div class="overlay" id="overlay">
        <aside class="sidebar" id="sidebar">
            <button class="close-btn" id="closeBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="main-image">
        <img id="productImage" src="./images/great.avif" alt="Gaming headset">

        <button class="photo-btn" id="prev" aria-label="Previous photo">
          &#8249;
        </button>

        <button class="photo-btn" id="next" aria-label="Next photo">
          &#8250;
        </button>
      </div>
            <h2 id="photoTitle"></h2>
            
        </aside>
    </div>
</main>
<div class="cursor"></div>
<div class="cursor-follower"></div>





    <script src="./js/app.js"></script>
</body>
</html>
